server {
    listen 80;
    root /usr/share/nginx/html;

    # Запросы к API отдаём контейнеру api
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Одностраничное приложение: любые адреса открывают index.html
    location / {
        try_files $uri /index.html;
    }
}
