# 7 контейнеров — ровно как на схеме C4 уровня 2.
# api, worker и beat собираются из одного образа (модульный монолит), различается только команда.

x-backend: &backend
  build: ./backend
  env_file: .env
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kk
      POSTGRES_PASSWORD: kk
      POSTGRES_DB: kk
    volumes: [db_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kk"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-kk-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-kk-minio-secret}
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]

  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A app.worker worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A app.worker beat --loglevel=info

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  db_data:
  minio_data:
