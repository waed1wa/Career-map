[project]
name = "karernaya-karta-api"
version = "0.1.0"
description = "Карьерная карта: API, фоновые задачи и планировщик (модульный монолит)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "celery>=5.4",
    "redis>=5.0",
    "minio>=7.2",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Файлы данных (справочник) должны попасть в образ вместе с кодом
[tool.setuptools.package-data]
"app.modules.catalog" = ["data/*.json"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Покрытие тестами — НФТ проекта: не меньше 70%. Ниже порога CI падает.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
